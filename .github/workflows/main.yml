name: Build & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  # bitcoin-xbt-kmp is not published to a public Maven repository yet: it is built from this commit and installed in the local Maven repository.
  XBT_KMP_REPOSITORY: ashbornelabs/bitcoin-xbt-kmp
  XBT_KMP_REF: 256e5548142e51273cc898964acabf61985d0ca8

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'adopt'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Check out bitcoin-xbt-kmp
      uses: actions/checkout@v4
      with:
        repository: ${{ env.XBT_KMP_REPOSITORY }}
        ref: ${{ env.XBT_KMP_REF }}
        path: bitcoin-xbt-kmp

    - name: Cache Gradle and Kotlin/Native dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle
          ~/.konan
        key: ${{ runner.os }}-xbt-kmp-${{ env.XBT_KMP_REF }}
        restore-keys: ${{ runner.os }}-xbt-kmp

    - name: Install bitcoin-xbt-kmp in the local Maven repository
      working-directory: bitcoin-xbt-kmp
      run: ./gradlew publishKotlinMultiplatformPublicationToMavenLocal publishJvmPublicationToMavenLocal

    - name: Build
      run: ./mvnw install -DskipTests

    - name: Test with libsecp256k1
      run: ./mvnw test
